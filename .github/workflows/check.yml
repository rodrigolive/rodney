name: Check

# Pre-merge gate mirroring `just check-ci`: fmt + vet + lint + test + build.
# The existing test.yml (cross-OS build + --version smoke) stays as-is.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: tidy (verify go.mod / go.sum committed)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: fmt (verify gofmt + goimports clean)
        run: |
          out=$(gofmt -l .); if [ -n "$out" ]; then echo "gofmt drift:"; echo "$out"; exit 1; fi
          out=$(go tool goimports -l .); if [ -n "$out" ]; then echo "goimports drift:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: lint
        run: go tool golangci-lint run ./...
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
      - name: test
        run: go test ./... -count=1
        env:
          ROD_CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: build
        run: go build -trimpath -ldflags "-s -w" -o rodney .
